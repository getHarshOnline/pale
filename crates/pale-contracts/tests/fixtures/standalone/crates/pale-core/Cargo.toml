[package]
name = "pale-core"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/getHarshOnline/pale"
description = "Pale core domain records, integrity identities, and canonicalization."
publish = false

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
doc_markdown = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_with = "=3.21.0"
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
jsonptr = { version = "=0.7.1", default-features = false }
unicode-normalization = "=0.1.25"
url = { version = "=2.5.8", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", features = ["asm"] }
hex = "=0.4.3"
thiserror = "=2.0.18"
serde_jcs = "=0.2.0"
