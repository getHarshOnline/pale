placement = "standalone_judgment"
see_also = [{ scope = "local", resource_id = "jupyter-practice" }, { scope = "local", resource_id = "evaluation-lineage" }]

[[doctrine.entry]]
id = "langfuse-practice"
description = "Check trace identities, dataset membership and score targets."
doctrine = "langfuse-practice.md"
placement = "standalone_judgment"
see_also = [{ scope = "local", resource_id = "evaluation-lineage" }, { scope = "local", resource_id = "langfuse-tooling" }]

[[doctrine.entry]]
id = "langfuse-tooling"
description = "Use Langfuse's official skill and available CLI or MCP for the selected task, checking versions, permissions and the relevant workflow."
