doctrine = "lineage/compare-decision-time-inputs.md"
placement = "standalone_judgment"
requires = [{ scope = "local", resource_id = "evaluation-lineage" }]

[[doctrine.entry]]
id = "lineage-trace-coverage-and-cost"
