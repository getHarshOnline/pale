[package]
name = "pale-mcp"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
authors = ["Harsh Joshi"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/getHarshOnline/pale"
description = "MCP transport over the reusable Pale command facade."
publish = false

[workspace]
resolver = "2"

[features]
# Enables an in-process caller for cross-interface development tests. It is
# disabled by default and opens no listener.
interface-test-support = []

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
doc_markdown = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"

[[bin]]
name = "pale-mcp"
path = "src/main.rs"
test = false

[dependencies]
pale-cli = { version = "=0.0.1", default-features = false, features = ["wire-schema"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "io-std", "io-util"] }
serde = { version = "=1.0.228", features = ["derive"] }
# Transport-only typed JSON tree support for rmcp model values; never semantic IR.
serde_json = "=1.0.149"
# Retain the failing advertised input path without exposing rejected values.
serde_path_to_error = "=0.1.20"
thiserror = "=2.0.18"

[dev-dependencies]
jsonschema = { version = "=0.49.2", default-features = false }
pale-application = { path = "../../crates/pale-application", features = ["interface-test-support"] }
pale-adapter-uds = { path = "../../adapters/uds" }
pale-contracts = { path = "../../crates/pale-contracts" }
pale-core = { path = "../../crates/pale-core" }
pale-ports = { path = "../../crates/pale-ports" }
pale-sdk = { path = "../../sdk/rust" }
pale-interface-test-support = { path = "../tests/support" }
