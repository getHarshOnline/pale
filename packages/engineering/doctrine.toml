requires = [{ scope = "local", resource_id = "common" }]

[[doctrine.entry]]
id = "security-review"
description = "Trace untrusted input to protected data and actions; check permission, secrets, exports, browser output and the actual failure path."
doctrine = "judgment/security-review.md"
placement = "standalone_judgment"

[[doctrine.entry]]
id = "latency-critical-systems"
description = "Measure response-time distributions and data age under realistic load, then improve the dominant cost while keeping overload and recovery safe."
