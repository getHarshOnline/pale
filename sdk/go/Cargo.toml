[package]
name = "pale-go-ffi"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
authors = ["Harsh Joshi"]
license = "Apache-2.0"
readme = "README.md"
description = "Private C ABI bridge for the idiomatic Go projection of pale-sdk."
repository = "https://github.com/getHarshOnline/pale"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[workspace]
resolver = "2"

[lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
doc_markdown = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"

[dependencies]
base64 = "=0.22.1"
pale-sdk = { version = "=0.0.1", features = ["native-local"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
