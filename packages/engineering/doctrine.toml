[doctrine]
schema_version = 1

[[doctrine.entry]]
id = "context-handoff-doctrine"
description = "Give the next worker the goal, sources, current state, settled corrections, existing permission and checks needed to continue."
doctrine = "context-handoff.md"
placement = "operation_procedure"

[[doctrine.entry]]
id = "native-execution-evidence"
description = "Connect a claim to the actual command, inputs and structured result, including child tasks, restoration and cleanup."
doctrine = "procedures/native-execution-evidence.md"
placement = "operation_procedure"

[[doctrine.entry]]
id = "error-handling"
description = "Keep failures distinguishable, recover partial changes, retry safely and stop cancelled work without confusing local cancellation with a remote outcome."
doctrine = "judgment/error-handling.md"
placement = "standalone_judgment"

[[doctrine.entry]]
id = "tdd-workflow"
description = "Pin down a required behaviour with a failing test, implement it and improve the structure while the checks pass."
