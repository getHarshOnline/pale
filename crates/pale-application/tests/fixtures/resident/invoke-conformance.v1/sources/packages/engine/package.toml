[package]
id = 'example.engine'
version = '1.0.0'
schema_version = 1
title = 'Synthetic'
description = 'Synthetic Package'
compatible_compilers = ['pale-surface@1']
sources = [
  { path = 'roles.toml', role = 'declaration' },
  { path = 'role.md', role = 'body' },
  { path = 'operations.toml', role = 'declaration' },
  { path = 'policy.toml', role = 'declaration' },
  { path = 'review.md', role = 'body' },
]
resources = [
  { id = 'engine', kind = 'role', definition_source = 'roles.toml', exposure = 'exported' },
  { id = 'review', kind = 'operation', definition_source = 'operations.toml', exposure = 'exported' },
  { id = 'review-policy', kind = 'capability_policy', definition_source = 'policy.toml', exposure = 'exported' },
]

