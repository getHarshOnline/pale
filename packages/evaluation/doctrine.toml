[[doctrine.entry]]
id = "typesafe-decision-practice"
description = "Check how the selected provider returns decisions and confidence."
doctrine = "typesafe-decision-practice.md"
placement = "standalone_judgment"
see_also = [{ scope = "local", resource_id = "decision-semantics" }]

[[doctrine.entry]]
id = "evaluation-instrument"
