[doctrine]
schema_version = 1

[[doctrine.entry]]
id = "decision-semantics"
description = "Choose the decision type, check calibration and define when to defer."
doctrine = "decisions.md"
placement = "standalone_judgment"

[[doctrine.entry]]
id = "evaluation-lineage"
description = "Keep replay inputs comparable and trace each result to its run."
doctrine = "lineage.md"
placement = "standalone_judgment"
see_also = [{ scope = "local", resource_id = "lineage-identify-the-run" }, { scope = "local", resource_id = "lineage-compare-decision-time-inputs" }, { scope = "local", resource_id = "lineage-trace-coverage-and-cost" }]

[[doctrine.entry]]
id = "reproducible-notebook"
description = "Run a notebook from clean state and check for leaked information."
