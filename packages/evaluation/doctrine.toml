[[doctrine.entry]]
id = "analytical-grain"
description = "Check what an analysis counts, how rows join and how totals and denominators reconcile."
doctrine = "analytical-grain.md"
placement = "standalone_judgment"

[[doctrine.entry]]
id = "lineage-identify-the-run"
