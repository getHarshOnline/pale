[package]
name = "pale-wasm"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
authors = ["Harsh Joshi"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/getHarshOnline/pale"
description = "WebAssembly build of pale-sdk's effect-free operations for compiling Pale Workspace documents."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "2"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
doc_markdown = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"

[dependencies]
pale-sdk = "=0.0.1"
wasm-bindgen = { version = "=0.2.127", default-features = false, features = ["std", "strict-macro"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.77"
