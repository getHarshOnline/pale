[package]
name = "pale-acp"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
authors = ["Harsh Joshi"]
license = "AGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/getHarshOnline/pale"
description = "ACP v1 client that conducts a coding-agent turn through pale-sdk."
publish = false

[workspace]
resolver = "2"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
doc_markdown = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"

[dependencies]
pale-sdk = "=0.0.1"
agent-client-protocol = { version = "=2.0.0", default-features = false }
futures = { version = "=0.3.32", default-features = false, features = ["std", "async-await"] }
serde_json = "=1.0.149"

[dev-dependencies]
async-io = "=2.6.0"
futures = { version = "=0.3.32", default-features = false, features = ["std", "async-await", "executor"] }
