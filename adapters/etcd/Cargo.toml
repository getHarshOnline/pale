[package]
name = "pale-adapter-etcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded authenticated etcd custody for independent rollback anchors."
publish = false

[lints]
workspace = true

[dependencies]
pale-core = { path = "../../crates/pale-core" }
pale-ports = { path = "../../crates/pale-ports" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "=0.22.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "blocking"] }

[dev-dependencies]
tempfile = { workspace = true }
rustls = { version = "=0.23.40", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
