[package]
name = "pale-interface-test-support"
version = "0.0.1"
edition = "2021"
rust-version = "1.94"
authors = ["Harsh Joshi"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/getHarshOnline/pale"
description = "Development-only resident conformance support for Pale interfaces."
publish = false

[workspace]
resolver = "2"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
doc_markdown = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
private_intra_doc_links = "deny"

[dependencies]
pale-application = { path = "../../../crates/pale-application" }
pale-cli = { path = "../../cli", default-features = false, features = ["wire-schema"] }
pale-contracts = { path = "../../../crates/pale-contracts" }
pale-core = { path = "../../../crates/pale-core" }
pale-ports = { path = "../../../crates/pale-ports" }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
